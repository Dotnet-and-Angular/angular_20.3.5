<section class="dashboard">
    <div class="card-header">
        <h2>{{ labels.TITLE }}</h2>

        <button class="primary" (click)="showAdd.set(!showAdd())">
            {{ showAdd() ? labels.CANCEL : labels.ADD_PERSON }}
        </button>
    </div>
    @if (showAdd()) {
    <div class="overlay">
        <div class="card add-card" role="dialog" [attr.aria-label]="labels.DIALOG_TITLE">
            <header class="card-header">
                <h3>{{ labels.ADD_PERSON }}</h3>
                <button class="close" type="button" (click)="showAdd.set(false)">✕</button>
            </header>

            <form [formGroup]="addPersonForm()" (ngSubmit)="onAddSubmit()" class="card-body">
                <div class="grid">
                    <label class="field">
                        <span class="label">Username</span>
                        <input type="text" formControlName="username" placeholder="Enter username" required />
                    </label>
                    <label class="field">
                        <span class="label">{{ labels.EMAIL_LABEL }}</span>
                        <input type="email" formControlName="email" [placeholder]="labels.EMAIL_PLACEHOLDER" required />
                    </label>
                    <label class="field">
                        <span class="label">Role</span>
                        <select formControlName="role" required>
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </label>
                    <label class="field">
                        <span class="label">Status</span>
                        <select formControlName="status" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </label>
                </div>

                <footer class="card-actions">
                    <button type="button" class="muted" (click)="showAdd.set(false)">{{ labels.CANCEL }}</button>
                    <button type="submit" class="primary" [disabled]="!addPersonForm().valid">{{ labels.SAVE }}</button>
                </footer>
            </form>
        </div>
    </div>
    }

    @if (!showAdd()) {
    <app-data-table [data]="people$()" [columns]="tableColumns" [striped]="true" [hoverable]="true" [bordered]="true"
        (rowSelected)="onRowSelected($event)" (rowDoubleClicked)="onRowDoubleClick($event)">
    </app-data-table>
    }
</section>
