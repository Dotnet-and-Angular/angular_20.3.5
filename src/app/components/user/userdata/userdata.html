<section class="dashboard">
    <div class="card-header">
        <h2>People</h2>

        <button class="primary" (click)="showAdd.set(!showAdd())">
            {{ showAdd() ? 'Cancel' : 'Add Person' }}
        </button>
    </div>
    @if (showAdd()) {
    <div class="overlay">
        <div class="card add-card" role="dialog" aria-label="Add person">
            <header class="card-header">
                <h3>Add Person</h3>
                <button class="close" type="button" (click)="showAdd.set(false)">✕</button>
            </header>

            <form [formGroup]="addPersonForm()" (ngSubmit)="onAddSubmit()" class="card-body">
                <div class="grid">
                    <label class="field">
                        <span class="label">Name</span>
                        <input type="text" formControlName="name" placeholder="Full name" required />
                    </label>
                    <label class="field">
                        <span class="label">Email</span>
                        <input type="email" formControlName="email" placeholder="name@example.com" required />
                    </label>
                    <label class="field">
                        <span class="label">Phone</span>
                        <input type="tel" formControlName="phone" placeholder="+1 555 555 5555" required />
                    </label>
                    <label class="field">
                        <span class="label">Age</span>
                        <input type="number" formControlName="age" placeholder="Age" min="1" max="120" />
                        @if (addPersonForm().get('age')?.invalid && addPersonForm().get('age')?.touched) {
                        <small class="error">Enter a valid age (1-120)</small>
                        }
                    </label>
                </div>

                <footer class="card-actions">
                    <button type="button" class="muted" (click)="showAdd.set(false)">Cancel</button>
                    <button type="submit" class="primary" [disabled]="!addPersonForm().valid">Save</button>
                </footer>
            </form>
        </div>
    </div>
    }

    @if (!showAdd()) {
    <app-data-table [data]="people()" [columns]="tableColumns" [striped]="true" [hoverable]="true" [bordered]="true"
        (rowSelected)="onRowSelected($event)" (rowDoubleClicked)="onRowDoubleClicked($event)">
    </app-data-table>
    }
</section>
