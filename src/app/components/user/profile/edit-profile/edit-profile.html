<div class="edit-profile-container">
    <h1>{{ labels.EDIT_PROFILE }}</h1>

    <form (ngSubmit)="onSubmit()" class="profile-form">
        <div class="form-section">
            <h3>{{ labels.PERSONAL_INFORMATION }}</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">{{ labels.FIRST_NAME }}</label>
                    <input type="text" id="firstName" [(ngModel)]="formData.firstName" name="firstName"
                        [placeholder]="labels.FIRST_NAME" />
                </div>
                <div class="form-group">
                    <label for="lastName">{{ labels.LAST_NAME }}</label>
                    <input type="text" id="lastName" [(ngModel)]="formData.lastName" name="lastName"
                        [placeholder]="labels.LAST_NAME" />
                </div>
            </div>

            <div class="form-group full-width">
                <label for="email">{{ labels.EMAIL }}</label>
                <input type="email" id="email" [(ngModel)]="formData.email" name="email"
                    [placeholder]="labels.EMAIL_PLACEHOLDER" />
            </div>

            <div class="form-group full-width">
                <label for="bio">{{ labels.BIO }}</label>
                <textarea id="bio" [(ngModel)]="formData.bio" name="bio" [placeholder]="labels.BIO" rows="4"></textarea>
            </div>
        </div>

        <div class="form-section">
            <h3>{{ labels.CONTACT_INFO }}</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">{{ labels.PHONE }}</label>
                    <input type="tel" id="phone" [(ngModel)]="formData.phone" name="phone"
                        [placeholder]="labels.PHONE_PLACEHOLDER" />
                </div>
                <div class="form-group">
                    <label for="location">{{ labels.LOCATION }}</label>
                    <input type="text" id="location" [(ngModel)]="formData.location" name="location"
                        [placeholder]="labels.LOCATION_PLACEHOLDER" />
                </div>
            </div>

            <div class="form-group full-width">
                <label for="website">Website</label>
                <input type="url" id="website" [(ngModel)]="formData.website" name="website"
                    placeholder="https://example.com" />
            </div>
        </div>

        <div class="form-section">
            <h3>{{ labels.PROFESSIONAL_INFO }}</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="department">{{ labels.DEPARTMENT }}</label>
                    <input type="text" id="department" [(ngModel)]="formData.department" name="department"
                        placeholder="{{ labels.DEPARTMENT }}" />
                </div>
                <div class="form-group">
                    <label for="role">{{ labels.ROLE }}</label>
                    <select id="role" [(ngModel)]="formData.role" name="role">
                        <option value="">{{ labels.ROLE_PLACEHOLDER }}</option>
                        <option value="user">{{ labels.ROLE_USER }}</option>
                        <option value="moderator">{{ labels.ROLE_MODERATOR }}</option>
                        <option value="admin">{{ labels.ROLE_ADMIN }}</option>
                    </select>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="skills">{{ labels.SKILLS }}</label>
                <input type="text" id="skills" [(ngModel)]="formData.skills" name="skills"
                    [placeholder]="labels.SKILLS_PLACEHOLDER" />
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ common.SAVE }}</button>
            <button type="button" class="btn btn-secondary" (click)="onCancel()">
                {{ common.CANCEL }}
            </button>
        </div>
    </form>

    @if (successMessage) {
    <div class="alert alert-success">
        {{ successMessage }}
    </div>
    }
</div>
